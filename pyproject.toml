[project]
name = "unreliable-assistant"
version = "0.1.0"
description = "Multi-tenant grounded enterprise operations assistant (see docs/design.md)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "anthropic>=0.40",
  "rank-bm25>=0.2.2",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assistant", "assistant.rag"]
